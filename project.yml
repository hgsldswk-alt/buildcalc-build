name: BuildCalc
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.buildcalc
    APP_STORE_ID: "6836773656"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BuildCalc:
    type: application
    platform: iOS
    sources: [BuildCalc, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BuildCalc AppStore
    info:
      path: BuildCalc/Info.plist
      properties:
        CFBundleDisplayName: 装修算料
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        BuildCalcProProductID: $(APP_ID).pro
        BuildCalcTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
  BuildCalcTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BuildCalcTests
      - path: Shared
        excludes: [Localizable.xcstrings]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  BuildCalcUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BuildCalcUITests]
    dependencies:
      - target: BuildCalc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BuildCalc
schemes:
  BuildCalc:
    build:
      targets:
        BuildCalc: all
        BuildCalcTests: [test]
    test:
      config: Debug
      targets: [BuildCalcTests]
  BuildCalcUI:
    build:
      targets:
        BuildCalc: all
        BuildCalcUITests: [test]
    test:
      config: Debug
      targets: [BuildCalcUITests]
